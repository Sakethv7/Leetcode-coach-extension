<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wandering_bot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="title-row">
        <h1>Wandering_bot</h1>
        <button id="openTutorial" class="ghost-btn">Tutorial</button>
      </div>
      <p class="muted">Strategic tutor mode: depth-first hints, then code only if unlocked.</p>

      <section class="card">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="ollama">Ollama</option>
          <option value="openai_compat">LM Studio / Open WebUI (OpenAI-compatible)</option>
        </select>

        <label for="endpoint">Endpoint</label>
        <input id="endpoint" type="text" placeholder="http://127.0.0.1:11434" />

        <label for="model">Model</label>
        <input id="model" type="text" placeholder="kimi-k2:1t-cloud" />

        <label for="traceEndpoint">Python Trace Endpoint</label>
        <input id="traceEndpoint" type="text" placeholder="http://127.0.0.1:8765" />

        <button id="saveConfig">Save Config</button>
      </section>

      <section class="card">
        <h2>Data & Privacy</h2>
        <label class="toggle-row" for="autoExpiryEnabled">
          <input id="autoExpiryEnabled" type="checkbox" />
          Auto-delete Wandering_bot data after N days
        </label>

        <label for="retentionDays">Retention days</label>
        <input id="retentionDays" type="number" min="1" max="365" step="1" value="7" />

        <div class="row">
          <button id="savePrivacy">Save Privacy Settings</button>
          <button id="clearData" class="danger">Clear All Wandering_bot Data</button>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <button id="capture">Capture Problem</button>
          <span id="problemMeta" class="muted">No problem loaded</span>
        </div>

        <div class="quick-actions">
          <button data-msg="Give me a small nudge, not the solution.">Nudge</button>
          <button data-msg="Give me the next hint.">Next Hint</button>
          <button data-msg="I will share my approach; critique it with one correction.">Review My Approach</button>
          <button id="visualize">Generate Replay</button>
        </div>

        <textarea id="userInput" rows="4" placeholder="Ask for a hint, share your approach, or ask where you're stuck..."></textarea>
        <div class="row">
          <label class="unlock">
            <input id="unlockCode" type="checkbox" />
            I explicitly want full code now
          </label>
          <button id="send">Send</button>
        </div>
      </section>

      <section class="card output">
        <h2>Wandering_bot</h2>
        <pre id="output">Start by opening a LeetCode problem tab, then click "Capture Problem".</pre>
        <p id="stateMeta" class="muted"></p>
        <div id="diagramWrap" class="diagram-wrap hidden">
          <div id="diagramMeta" class="muted"></div>
          <div class="row">
            <button id="diagramPrev">Prev</button>
            <button id="diagramPlay">Play</button>
            <button id="diagramNext">Next</button>
          </div>
          <div id="diagramSvg"></div>
        </div>
      </section>

      <section id="tutorialOverlay" class="tutorial-overlay hidden">
        <div class="tutorial-card">
          <p id="tutorialStepMeta" class="tutorial-step">Step 1/1</p>
          <h3 id="tutorialTitle">Welcome</h3>
          <p id="tutorialBody" class="tutorial-body"></p>
          <div class="tutorial-actions">
            <button id="tutorialBack" class="ghost-btn">Back</button>
            <button id="tutorialNext">Next</button>
            <button id="tutorialClose" class="danger">Close</button>
          </div>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
